; MorseOS bundle: what goes into the firmware.
; Apps and features set to n are left out together with every library only they use
; (sources, RAM, GATT services, menu entries). See tools/bundle.py and IDEE.md.

[bundle]
name    = morseos
version = 0.5.6

[apps]
face     = y   ; watch face, the home screen
info     = y   ; MENU > INFO
practice = y   ; STRUMENTI > PRATICA
sensors  = y   ; STRUMENTI > SENSORI: find the I2C sensors (heart rate, accelerometer)
message  = y   ; notifications from the FitPro UART

[features]
fitpro   = y   ; FitPro UART: lt716 settime / notify / find
